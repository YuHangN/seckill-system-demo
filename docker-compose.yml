# docker-compose.yml

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      # KRaft 模式：不需要 Zookeeper，apache/kafka 官方镜像
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 本机直连关键：ADVERTISED 用 localhost，否则客户端会解析不了 "kafka" hostname
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 单节点必须设为 1，否则内部 topic 默认需要 3 个副本，永远创建不了
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # RabbitMQ — 用于订单超时取消的延迟消息（DLX + TTL）
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI: http://localhost:15672 guest/guest

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seckill
  seckill-api:
    build: { context: ., dockerfile: cmd/seckill-api/Dockerfile }
    ports:
      - "8080:8080"
    depends_on: [kafka, redis, postgres]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      DB_DSN: "host=postgres user=postgres password=postgres dbname=seckill sslmode=disable"
      PORT: "8080"

  order-service:
    build: { context: ., dockerfile: cmd/order-service/Dockerfile }
    ports:
      - "8081:8081"
    depends_on: [kafka, redis, postgres, rabbitmq]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      DB_DSN: "host=postgres user=postgres password=postgres dbname=seckill sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      PORT: "8081"

  stats-service:
    build: { context: ., dockerfile: cmd/stats-service/Dockerfile }
    depends_on: [kafka, redis]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379

  notification-service:
    build: { context: ., dockerfile: cmd/notification-service/Dockerfile }
    depends_on: [kafka]
    environment:
      KAFKA_BROKERS: kafka:9092

  dashboard:
    build: { context: ./dashboard }
    ports:
      - "5173:80"
    depends_on: [seckill-api]

